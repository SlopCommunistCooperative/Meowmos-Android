name: Build Signed Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag (leave blank for the rolling main pre-release)
        type: string
        required: false

permissions: {}

concurrency:
  group: apk-${{ inputs.release_tag || 'main' }}
  cancel-in-progress: ${{ !inputs.release_tag }}

env:
  BUILD_TOOLS: "37.0.0"

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Resolve source commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          sha="$GITHUB_SHA"
          if [[ -n "$RELEASE_TAG" ]]; then
            if [[ ! "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta)\.[0-9]+)?$ ]]; then
              echo "Expected a version tag such as v2.3.0 or 2.3.0-beta.1." >&2
              exit 1
            fi
            sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/tags/$RELEASE_TAG" --jq '.sha')
            status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$sha...$GITHUB_SHA" --jq '.status')
            if [[ "$status" != identical && "$status" != ahead ]]; then
              echo "The release commit must be on main." >&2
              exit 1
            fi
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Building commit \`$sha\`." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Build unsigned release APK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37" "build-tools;$BUILD_TOOLS" "ndk;28.2.13676358"
          ./gradlew :app:assembleRelease
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: unsigned-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          overwrite: true

  sign:
    needs: build
    runs-on: ubuntu-latest
    environment: release-signing
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: unsigned-release
      - name: Install Android signing tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;$BUILD_TOOLS"
      - name: Sign and verify APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -o pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_SIGNING_STORE_PASSWORD ANDROID_SIGNING_KEY_ALIAS ANDROID_SIGNING_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing $name in the release-signing environment." >&2
              exit 1
            fi
          done
          umask 077
          keystore=$(mktemp "$RUNNER_TEMP/release-keystore.XXXXXXXX")
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          unset ANDROID_KEYSTORE_BASE64
          signer="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          "$signer" sign --ks "$keystore" --ks-key-alias "$ANDROID_SIGNING_KEY_ALIAS" \
            --ks-pass env:ANDROID_SIGNING_STORE_PASSWORD --key-pass env:ANDROID_SIGNING_KEY_PASSWORD \
            --v4-signing-enabled false --out app-release.apk app-release-unsigned.apk
          unset ANDROID_SIGNING_STORE_PASSWORD ANDROID_SIGNING_KEY_PASSWORD
          "$signer" verify --verbose --print-certs app-release.apk
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: signed-release
          path: app-release.apk
          if-no-files-found: error
          overwrite: true

  publish:
    needs: [build, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: signed-release
      - name: Publish signed APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            tag_sha=$(gh api "repos/$GH_REPO/commits/tags/$RELEASE_TAG" --jq '.sha')
            if [[ "$tag_sha" != "$SOURCE_SHA" ]]; then
              echo "The release tag moved after the build." >&2
              exit 1
            fi
            apk="meowmos-v${RELEASE_TAG#v}.apk"
            mv app-release.apk "$apk"
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              gh release upload "$RELEASE_TAG" "$apk"
            else
              args=(--verify-tag --generate-notes)
              if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
              gh release create "$RELEASE_TAG" "$apk" "${args[@]}"
            fi
          else
            mv app-release.apk meowmos-main.apk
            notes="Signed pre-release from [\`${SOURCE_SHA:0:7}\`]($GITHUB_SERVER_URL/$GH_REPO/commit/$SOURCE_SHA)."
            if gh release view pre-release >/dev/null 2>&1; then
              gh api --method PATCH "repos/$GH_REPO/git/refs/tags/pre-release" \
                -f sha="$SOURCE_SHA" -F force=true --silent
              gh release upload pre-release meowmos-main.apk --clobber
              gh release edit pre-release --prerelease --latest=false --notes "$notes"
            else
              gh release create pre-release meowmos-main.apk --target "$SOURCE_SHA" \
                --title main --prerelease --latest=false --notes "$notes"
            fi
          fi
